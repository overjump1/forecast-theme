[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "forecast-theme"
version = "0.4.0"
description = "The shared design system: palette, stylesheet, fonts and Windows glass."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tomer Ady" }]
keywords = ["qt", "pyqt6", "theme", "design-system", "stylesheet"]

# PyQt6 is a hard dependency rather than an extra: styling.py and widgets/switch.py import it at
# module scope, and failing there is worse than failing at resolve time. The Qt-free property of
# palette.py is preserved as a *testability* guarantee, not an install-time one.
#
# Floor at 6.6 -- the lowest any consumer needs. algo-gui asks 6.8 for QStyleHints.setColorScheme,
# but styling.apply() already guards that with hasattr, so 6.6 genuinely works; each app keeps its
# own higher floor in its own requirements.txt. Deliberately no upper pin: a cap here would make
# this package the thing blocking every app's Qt upgrade.
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/overjump1/forecast-theme"

# PyInstaller discovers hooks from installed distributions through this entry point, which is what
# lets a consuming app bundle the fonts without a datas entry in its own .spec.
[project.entry-points.pyinstaller40]
hook-dirs = "forecast_theme.__pyinstaller:get_hook_dirs"

# hatchling includes non-Python files under the package directory by default. That is the reason
# for choosing it over setuptools here: the install path is a git checkout, so the wheel is built
# from a bare tree, and setuptools would silently ship a font-less wheel if package-data were
# forgotten. test_packaging.py asserts the fonts survived regardless.
[tool.hatch.build.targets.wheel]
packages = ["forecast_theme"]

[tool.hatch.build.targets.sdist]
include = ["forecast_theme", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
